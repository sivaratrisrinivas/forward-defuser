services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: fd, POSTGRES_PASSWORD: fd, POSTGRES_DB: fd }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "fd"], interval: 2s, retries: 30 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fd:fd@db:5432/fd
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      ROLE: api
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fd:fd@db:5432/fd
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      ROLE: worker
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
