  TRUE: "✅ இது உண்மைதான்."
  SATIRE: "😄 இது நையாண்டி, நகைச்சுவைக் கட்டுரை, உண்மைச் செய்தி அல்ல."
  SCAM: "🚨 இது ஒரு மோசடி. தயவுசெய்து கிளிக் செய்யவோ பதில் அனுப்பவோ வேண்டாம்."
  UNVERIFIED: "🤔 இதை இப்போது என்னால் உறுதிப்படுத்த முடியவில்லை."
opener:
  FALSE: ["பகிர்வதற்கு முன் சரிபார்த்தது நல்லது!"]
  MISLEADING: ["இதில் கொஞ்சம் உண்மை உண்டு, ஆனால் கதை திரிக்கப்பட்டுள்ளது."]
  TRUE: ["நல்ல செய்தி: இது உண்மையானது."]
  SATIRE: ["இது சிரிக்க வைப்பதற்காக எழுதப்பட்டது, அதனால் பலர் ஏமாந்தனர்."]
  SCAM: ["மோசடிக்காரர்கள் மிகவும் தந்திரமாகிவிட்டார்கள், நீங்கள் கவனமாக இருந்தது சரி."]
  UNVERIFIED: ["நம்பகமான யாரும் இதை இன்னும் உறுதிப்படுத்தவோ மறுக்கவோ இல்லை."]
next_step:
  FALSE: "👉 தயவுசெய்து இதைப் பகிர வேண்டாம். குழுவில் வந்திருந்தால், இந்தப் பதிலை அங்கே பகிரலாம்."
  MISLEADING: "👉 இதை அப்படியே பகிராமல் இருப்பது நல்லது."
  TRUE: "👉 பகிரலாம், முடிந்தால் ஆதார இணைப்புடன்."
  SATIRE: "👉 நகைச்சுவையை ரசியுங்கள், ஆனால் செய்தியாகப் பகிர வேண்டாம்."
  SCAM: "👉 எதையும் கிளிக் செய்யவோ, பணம் அனுப்பவோ, OTP/PIN பகிரவோ வேண்டாம். 1930 (சைபர் மோசடி உதவி எண்) அல்லது cybercrime.gov.in-ல் புகார் செய்து, அனுப்பியவரைத் தடுக்கவும்."
  UNVERIFIED: "👉 இப்போதைக்கு இதைப் பகிர வேண்டாம். நான் கவனித்து, உண்மைச் சரிபார்ப்பு வந்தால் உங்களுக்குச் சொல்கிறேன்."
sources: "ஆதாரங்கள்:"
opinion: "🙂 இது ஒரு கருத்து அல்லது வாழ்த்து, சரிபார்க்கக்கூடிய தகவல் அல்ல."
nothing_to_check: "🙂 இதில் சரிபார்க்க எந்தக் கூற்றும் இல்லை. சந்தேகமான செய்தியை எனக்கு அனுப்புங்கள்."
busy: "😅 இப்போது நிறைய செய்திகள் வருகின்றன. சிறிது நேரம் கழித்து மீண்டும் முயற்சிக்கவும்."
rate_limited: "🙏 ஒரே நேரத்தில் நிறைய செய்திகள்! ஒரு நிமிடம் பொறுத்து மீண்டும் அனுப்புங்கள்."
too_long: "(செய்தி மிக நீளமாக இருந்ததால், முதல் பகுதியை மட்டும் சரிபார்த்தேன்.)"
help: "சந்தேகமான எந்தச் செய்தியையும் (உரை, புகைப்படம், குரல் பதிவு அல்லது இணைப்பு) எனக்கு அனுப்புங்கள், நான் சரிபார்க்கிறேன். குழுவில், அந்தச் செய்திக்கு /check என்று பதில் அனுப்புங்கள். உங்கள் தரவை நீக்க /forget அனுப்புங்கள்."
help_wa_group: "WhatsApp குழுவில் நீங்கள் பதிலளித்த செய்தியை என்னால் பார்க்க முடியாது. /check-க்குப் பிறகு செய்தியின் உரையை எழுதுங்கள், அல்லது அதை நேரடியாக எனக்கு அனுப்புங்கள்."
start: "வணக்கம்! 🙏 சந்தேகமான எந்தச் செய்தியையும் எனக்கு அனுப்புங்கள். அது உண்மையா, பொய்யா, மோசடியா என்று ஆதாரத்துடன் சொல்கிறேன்."
forget_done: "முடிந்தது. உங்களைப் பற்றி சேமித்திருந்ததை நீக்கிவிட்டேன்."
update: "📢 நீங்கள் முன்பு கேட்ட செய்தி பற்றிய புதுப்பிப்பு:"
error: "😅 என் பக்கத்தில் ஏதோ தவறு நடந்துவிட்டது. சிறிது நேரம் கழித்து மீண்டும் முயற்சிக்கவும்."
