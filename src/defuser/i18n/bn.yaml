help: "যে কোনো সন্দেহজনক মেসেজ (লেখা, ছবি, ভয়েস নোট বা লিঙ্ক) আমাকে ফরওয়ার্ড করুন, আমি যাচাই করব। গ্রুপে, ওই মেসেজের উত্তরে /check লিখুন। আপনার তথ্য মুছতে /forget পাঠান।"
help_wa_group: "WhatsApp গ্রুপে আপনি যে মেসেজের উত্তর দিয়েছেন সেটা আমি দেখতে পাই না। /check-এর পরে মেসেজের লেখাটা লিখুন, বা মেসেজটা সরাসরি আমাকে ফরওয়ার্ড করুন।"
