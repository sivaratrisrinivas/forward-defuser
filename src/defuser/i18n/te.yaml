headline:
  FALSE: "❌ ఇది తప్పుడు సమాచారం."
  MISLEADING: "⚠️ ఇది తప్పుదోవ పట్టించే సమాచారం."
  TRUE: "✅ ఇది నిజమే."
  SATIRE: "😄 ఇది వ్యంగ్యం, హాస్య కథనం, నిజమైన వార్త కాదు."
  SCAM: "🚨 ఇది మోసం. దయచేసి క్లిక్ చేయవద్దు, జవాబు ఇవ్వవద్దు."
  UNVERIFIED: "🤔 దీన్ని ఇప్పుడే నేను నిర్ధారించలేకపోతున్నాను."
opener:
  FALSE: ["ఫార్వర్డ్ చేసే ముందు చెక్ చేయడం మంచిది!"]
  MISLEADING: ["ఇందులో కొంత నిజం ఉంది, కానీ కథను వక్రీకరించారు."]
  TRUE: ["మంచి వార్త: ఇది నిజమైనదే."]
  SATIRE: ["ఇది నవ్వించడానికి రాసింది, అందుకే చాలా మంది మోసపోయారు."]
  SCAM: ["మోసగాళ్లు చాలా తెలివిగా మారారు, మీరు జాగ్రత్తగా ఉండటం సరైనదే."]
  UNVERIFIED: ["నమ్మదగిన ఎవరూ దీన్ని ఇంకా నిర్ధారించలేదు, ఖండించలేదు."]
next_step:
  FALSE: "👉 దయచేసి దీన్ని ఫార్వర్డ్ చేయవద్దు. గ్రూప్‌లో వచ్చి ఉంటే, ఈ జవాబును అక్కడ షేర్ చేయవచ్చు."
  MISLEADING: "👉 దీన్ని ఉన్నది ఉన్నట్టు ఫార్వర్డ్ చేయకపోవడం మంచిది."
  TRUE: "👉 షేర్ చేయవచ్చు, వీలైతే మూల లింక్‌తో."
  SATIRE: "👉 హాస్యాన్ని ఆస్వాదించండి, కానీ వార్తగా ఫార్వర్డ్ చేయవద్దు."
  SCAM: "👉 దేనినీ క్లిక్ చేయవద్దు, డబ్బు పంపవద్దు, OTP/PIN ఎవరికీ చెప్పవద్దు. 1930 (సైబర్ మోసం హెల్ప్‌లైన్) లేదా cybercrime.gov.in లో ఫిర్యాదు చేసి, పంపినవారిని బ్లాక్ చేయండి."
  UNVERIFIED: "👉 ప్రస్తుతానికి దీన్ని ఫార్వర్డ్ చేయవద్దు. నేను గమనిస్తూ ఉంటాను, ఫ్యాక్ట్-చెక్ వస్తే మీకు చెబుతాను."
sources: "మూలాలు:"
opinion: "🙂 ఇది ఒక అభిప్రాయం లేదా శుభాకాంక్ష, తనిఖీ చేయగల వాస్తవం కాదు."
nothing_to_check: "🙂 ఇందులో తనిఖీ చేయడానికి ఏ వాదనా కనిపించలేదు. అనుమానం ఉన్న మెసేజ్‌ను నాకు పంపండి."
busy: "😅 ప్రస్తుతం చాలా మెసేజ్‌లు వస్తున్నాయి. కాసేపటి తర్వాత మళ్లీ ప్రయత్నించండి."
rate_limited: "🙏 ఒకేసారి చాలా మెసేజ్‌లు! ఒక నిమిషం ఆగి మళ్లీ పంపండి."
too_long: "(మెసేజ్ చాలా పొడవుగా ఉంది, అందుకే మొదటి భాగాన్ని తనిఖీ చేశాను.)"
help: "అనుమానం ఉన్న ఏ మెసేజ్‌నైనా (టెక్స్ట్, ఫోటో, వాయిస్ నోట్ లేదా లింక్) నాకు ఫార్వర్డ్ చేయండి, నేను తనిఖీ చేస్తాను. గ్రూప్‌లో, ఆ మెసేజ్‌కు /check అని రిప్లై ఇవ్వండి. మీ డేటాను తొలగించడానికి /forget పంపండి."
help_wa_group: "WhatsApp గ్రూప్‌లో మీరు రిప్లై ఇచ్చిన మెసేజ్‌ను నేను చూడలేను. /check తర్వాత మెసేజ్ టెక్స్ట్ రాయండి, లేదా ఆ మెసేజ్‌ను నేరుగా నాకు ఫార్వర్డ్ చేయండి."
start: "నమస్కారం! 🙏 అనుమానం ఉన్న ఏ మెసేజ్‌నైనా నాకు ఫార్వర్డ్ చేయండి. అది నిజమా, అబద్ధమా, మోసమా అని ఆధారాలతో చెబుతాను."
forget_done: "అయిపోయింది. మీ గురించి నేను దాచినదంతా తొలగించాను."
update: "📢 మీరు ఇంతకు ముందు అడిగిన మెసేజ్ గురించి అప్‌డేట్:"
error: "😅 నా వైపు ఏదో పొరపాటు జరిగింది. కాసేపటి తర్వాత మళ్లీ ప్రయత్నించండి."
