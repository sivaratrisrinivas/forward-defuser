help: "जिस भी मैसेज पर शक हो (टेक्स्ट, फोटो, वॉइस नोट या लिंक), मुझे फॉरवर्ड करें, मैं जाँच कर बताऊँगा। ग्रुप में उस मैसेज पर /check लिखकर जवाब दें। अपना डेटा हटाने के लिए /forget भेजें।"
start: "नमस्ते! 🙏 जिस मैसेज पर शक हो, मुझे फॉरवर्ड करें। मैं स्रोत के साथ बताऊँगा कि वह सच है, झूठ है या स्कैम।"
forget_done: "हो गया। आपके बारे में जो भी जानकारी थी, मैंने मिटा दी है।"
