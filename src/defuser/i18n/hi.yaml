help_wa_group: "WhatsApp ग्रुप में मैं वह मैसेज नहीं देख पाता जिस पर आपने जवाब दिया। /check के बाद मैसेज का टेक्स्ट लिखें, या वह मैसेज सीधे मुझे फॉरवर्ड करें।"
