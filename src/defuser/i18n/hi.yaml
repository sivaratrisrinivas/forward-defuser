opinion: "🙂 यह एक राय या शुभकामना है, कोई तथ्य नहीं जिसे जाँचा जा सके।"
nothing_to_check: "🙂 इसमें जाँचने लायक कोई दावा नहीं मिला। जिस मैसेज पर शक हो, वह मुझे भेजें।"
