sources: "स्रोत:"
opinion: "🙂 हे एक मत किंवा शुभेच्छा आहे, तपासता येईल असे तथ्य नाही."
nothing_to_check: "🙂 यात तपासण्यासारखा कोणताही दावा सापडला नाही. ज्या मेसेजबद्दल शंका आहे, तो मला पाठवा."
busy: "😅 सध्या खूप मेसेज येत आहेत. कृपया थोड्या वेळाने पुन्हा प्रयत्न करा."
rate_limited: "🙏 एकाच वेळी खूप मेसेज! एक मिनिट थांबून पुन्हा पाठवा."
too_long: "(मेसेज खूप मोठा होता, म्हणून मी सुरुवातीचा भाग तपासला.)"
help: "ज्या मेसेजबद्दल शंका आहे (मजकूर, फोटो, व्हॉइस नोट किंवा लिंक), तो मला फॉरवर्ड करा, मी तपासून सांगेन. ग्रुपमध्ये, त्या मेसेजला /check असे उत्तर द्या. तुमचा डेटा हटवण्यासाठी /forget पाठवा."
help_wa_group: "WhatsApp ग्रुपमध्ये तुम्ही ज्या मेसेजला उत्तर दिले तो मला दिसत नाही. /check नंतर मेसेजचा मजकूर लिहा, किंवा तो मेसेज थेट मला फॉरवर्ड करा."
start: "नमस्कार! 🙏 ज्या मेसेजबद्दल शंका आहे, तो मला फॉरवर्ड करा. तो खरा आहे, खोटा आहे की फसवणूक, हे मी स्रोतांसह सांगेन."
forget_done: "झाले. तुमच्याबद्दल जे साठवले होते, ते मी हटवले आहे."
update: "📢 तुम्ही आधी विचारलेल्या मेसेजबद्दल अपडेट:"
error: "😅 माझ्या बाजूने काहीतरी चूक झाली. कृपया थोड्या वेळाने पुन्हा प्रयत्न करा."
